server:
  port: 8086

spring:
  application:
    name: fine-service
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/fine_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: fine_user
    password: fine_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${server.port}
        hostname: localhost
        ip-address: 127.0.0.1
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-timeout: 10s

security:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationThatIsAtLeast32CharactersLong"

fine:
  late-fee-per-day: 5000
  max-fine-amount: 500000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.university: DEBUG
