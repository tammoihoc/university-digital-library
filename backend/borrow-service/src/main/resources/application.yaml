server:
  port: 8084

spring:
  application:
    name: borrow-service
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/borrow_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: borrow_user
    password: borrow_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${server.port}
        hostname: localhost
        ip-address: 127.0.0.1
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-timeout: 10s

security:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationThatIsAtLeast32CharactersLong"
  internal:
    # ĐÃ THÊM — cùng lý do như user-service: FeignConfig đọc property này bằng
    # @Value không có default, thiếu nó khiến borrow-service KHÔNG khởi động được.
    # Giá trị PHẢI giống hệt user-service (bên nhận) để xác thực service-to-service.
    api-key: "internal-service-shared-secret-key-CHANGE-ME-in-production"

borrow:
  max-days: 14
  fine-per-day: 5000
  max-books-per-user: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.university: DEBUG
