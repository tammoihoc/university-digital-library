server:
  port: 8081

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/university_digital_library?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${server.port}
        # THÊM CÁC DÒNG NÀY ĐỂ FIX LỖI HOSTNAME
        hostname: localhost                    # Dùng localhost thay vì archlinux
        ip-address: 127.0.0.1                  # Dùng IP trực tiếp
        prefer-ip-address: true                # Ưu tiên dùng IP
        # Cấu hình health check đúng cách
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-timeout: 10s
        # Dùng localhost trong health check URL
        health-check-url: http://localhost:${server.port}/actuator/health
        # Metadata (optional)
        metadata:
          secure: "false"
          version: "1.0"

# JWT Configuration
# auth-service/src/main/resources/application.yml
security:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationThatIsAtLeast32CharactersLong"
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true

logging:
  level:
    com.university_digital_library.auth_service: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.consul: DEBUG
