# gateway-service/src/main/resources/application.yml
server:
  port: 8080

spring:
  application:
    name: gateway-service
  
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      
      default-filters:
        - PreserveHostHeader
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}
        
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        
        - id: borrow-service
          uri: lb://borrow-service
          predicates:
            - Path=/api/borrows/**,/api/reservations/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        
        - id: entry-exit-service
          uri: lb://entry-exit-service
          predicates:
            - Path=/api/entry-exit/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        
        - id: fine-service
          uri: lb://fine-service
          predicates:
            - Path=/api/fines/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        
        - id: static-files
          uri: lb://book-service
          predicates:
            - Path=/uploads/**
    
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${server.port}
        hostname: localhost
        ip-address: 127.0.0.1
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-timeout: 10s

