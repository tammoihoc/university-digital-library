server:
  port: 8082

spring:
  application:
    name: user-service
  
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: user_user
    password: user_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        instance-id: ${spring.application.name}:${server.port}
        hostname: localhost
        ip-address: 127.0.0.1
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-timeout: 10s
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

security:
  jwt:
    secret: "mySuperSecretKeyForJWTGenerationThatIsAtLeast32CharactersLong"
  aes:
    secret-key: "MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY="
  blind-index:
    # Khóa dùng để tính HMAC-SHA256 cho email/studentId/lecturerId (tra cứu +
    # UNIQUE). PHẢI khác khóa AES ở trên — dùng chung khóa cho 2 mục đích
    # (mã hóa 2 chiều và băm 1 chiều) là thực hành không tốt về mật mã học.
    secret-key: "cXV5ZW4tZGFpLWhvYy10aHV2aWVuLXNvLWJsaW5kLWluZGV4LWtleQ=="
  internal:
    # ĐÃ THÊM — property này bị THIẾU hoàn toàn trước đây dù InternalServiceAuthFilter
    # đọc nó bằng @Value("${security.internal.api-key}") không có giá trị mặc định.
    # Spring Boot không resolve được placeholder này -> context khởi tạo LỖI ngay
    # từ đầu -> service không lên được (biểu hiện ra ngoài là lỗi 503 qua Gateway,
    # vì Gateway không tìm thấy instance nào registered để forward request tới).
    # PHẢI giống hệt giá trị ở borrow-service và auth-service (2 service gọi Feign
    # sang user-service) vì đây là secret dùng chung để service-to-service tin nhau.
    api-key: "internal-service-shared-secret-key-CHANGE-ME-in-production"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator

logging:
  level:
    com.university: DEBUG
    org.springframework.security: DEBUG
